name: Check Upstream Release

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get latest upstream version
        id: upstream-version
        run: |
          sudo apt-get install dpkg
          wget https://files2.freedownloadmanager.org/6/latest/freedownloadmanager.deb
          VERSION=$(dpkg-deb -f freedownloadmanager.deb Version)
          echo "Upstream version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest CI build release version
        id: ci-release-version
        run: |
          VERSION=$(curl -sL "https://api.github.com/repos/AMA147000/FDM-AppImage/releases/latest" | jq -r ".tag_name")
          echo "CI release version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Compare versions & repackage if needed
        run: |
          if [ "${{ steps.upstream-version.outputs.VERSION }}" != "${{ steps.ci-release-version.outputs.VERSION }}" ]; then
            echo "New upstream version available! Repackaging new version..."

            sudo apt-get install fuse imagemagick

            wget -c "$(wget -qO- https://api.github.com/repos/AppImage/appimagetool/releases/latest \
              | grep browser_download_url \
              | grep x86_64.AppImage \
              | cut -d '"' -f 4)"
            chmod +x ./appimagetool-*.AppImage

            wget -c "$(wget -qO- https://api.github.com/repos/AppImage/pkg2appimage/releases/latest \
              | grep browser_download_url \
              | grep x86_64.AppImage \
              | cut -d '"' -f 4)"
            chmod +x ./pkg2appimage-*.AppImage

            wget https://raw.githubusercontent.com/AMA147000/FDM-AppImage/main/FDM-for-ci.yml

            mkdir ./freedownloadmanager/
            mv ./freedownloadmanager.deb ./freedownloadmanager/

            ./pkg2appimage-*.AppImage FDM-for-ci.yml
            ./appimagetool-*.AppImage ./freedownloadmanager/freedownloadmanager.AppDir -u "gh-releases-zsync|AMA147000|FDM-AppImage|latest|Free_Download_Manager-x86_64.AppImage.zsync"
          else
            echo "CI release is up to date with upstream."
          fi

      - name: Release new AppImage
        uses: softprops/action-gh-release@v3
        if: steps.upstream-version.outputs.VERSION != steps.ci-release-version.outputs.VERSION
        with:
          tag_name: ${{ steps.upstream-version.outputs.VERSION }}
          files: |
            Free_Download_Manager-x86_64.AppImage
            Free_Download_Manager-x86_64.AppImage.zsync
